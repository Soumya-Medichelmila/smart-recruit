<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart_Recruit — Screening Results</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* ── Job Selector ── */
        .job-select-card {
            background: white; border-radius: 16px;
            padding: 20px 24px; border: 1px solid #E5E7EB;
            margin-bottom: 24px;
            display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap;
        }
        .job-select-card .form-group { flex: 1; min-width: 200px; margin-bottom: 0; }

        .count-badge {
            background: #EEF2FF; color: #4F46E5;
            padding: 8px 16px; border-radius: 10px;
            font-size: 13px; font-weight: 600; white-space: nowrap;
            display: none;
        }

        /* ── Tabs ── */
        .tabs {
            display: flex; gap: 4px; background: #F3F4F6;
            padding: 4px; border-radius: 10px;
            width: fit-content; margin-bottom: 20px;
        }
        .tab {
            padding: 8px 18px; border-radius: 7px;
            cursor: pointer; font-size: 13px; font-weight: 500;
            color: #6B7280; border: none; background: none; transition: all .15s;
        }
        .tab.active { background: white; color: #4F46E5; box-shadow: 0 1px 3px rgba(0,0,0,.1); }

        /* ── Cards Grid ── */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        @media (max-width: 600px) { .cards-grid { grid-template-columns: 1fr; } }

        /* ── Candidate Card ── */
        .candidate-card {
            background: white; border-radius: 14px;
            border: 1px solid #E5E7EB; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
            position: relative; transition: box-shadow .2s, border-color .2s;
        }
        .candidate-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); border-color: #C7D2FE; }
        .candidate-card.shortlisted { border-left: 4px solid #10B981; }

        .card-rank {
            position: absolute; top: 14px; right: 14px; font-size: 20px;
        }
        .card-name  { font-size: 15px; font-weight: 700; color: #1F2937; padding-right: 32px; }
        .card-email { font-size: 12px; color: #9CA3AF; }

        /* Score */
        .score-row { display: flex; align-items: center; gap: 12px; }
        .score-ring {
            width: 54px; height: 54px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 800; border: 3px solid; flex-shrink: 0;
        }
        .score-bar-wrap { flex: 1; }
        .score-bar-label { font-size: 11px; color: #6B7280; margin-bottom: 4px; }
        .score-bar-bg { background: #F3F4F6; border-radius: 20px; height: 8px; overflow: hidden; }
        .score-bar-fill { height: 100%; border-radius: 20px; }

        /* Reason */
        .reason-text {
            font-size: 12px; color: #6B7280; line-height: 1.5;
            border-left: 3px solid #E5E7EB; padding-left: 10px;
        }

        /* Skills */
        .skills-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
        .skill-tag {
            background: #EEF2FF; color: #4338CA;
            font-size: 11px; padding: 3px 10px;
            border-radius: 20px; font-weight: 500;
        }

        /* Badges */
        .badges-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
        .badge-shortlisted { background: #D1FAE5; color: #065F46; }
        .badge-section     { background: #F3F4F6; color: #6B7280; }
        .badge-auto        { background: #FEF3C7; color: #92400E; }

        /* Actions */
        .card-actions { display: flex; gap: 8px; }
        .btn-action {
            flex: 1; padding: 8px; border-radius: 8px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            border: none; transition: all .2s;
        }
        .btn-remove { background: #FEE2E2; color: #991B1B; }
        .btn-remove:hover { background: #FECACA; }
        .btn-add    { background: #D1FAE5; color: #065F46; }
        .btn-add:hover { background: #A7F3D0; }

        /* Empty / Loading */
        .empty-state { text-align: center; padding: 60px 24px; color: #9CA3AF; }
        .empty-state .icon { font-size: 52px; margin-bottom: 16px; }

        /* Summary pills */
        .summary-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .summary-pill {
            padding: 7px 16px; border-radius: 20px;
            font-size: 13px; font-weight: 600;
        }
        .pill-total      { background: #F3F4F6; color: #374151; }
        .pill-shortlisted{ background: #D1FAE5; color: #065F46; }

        @media (max-width: 768px) {
            .job-select-card { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="layout">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <h1>⚡ Smart_Recruit</h1>
            <p>Admin Panel</p>
        </div>
        <nav class="sidebar-nav">
            <a href="admin-dashboard.html"><span class="icon">🏠</span> Dashboard</a>
            <a href="employee-list.html"><span class="icon">👥</span> Employees</a>
            <a href="add-employee.html"><span class="icon">➕</span> Add Employee</a>
            <a href="masters.html"><span class="icon">📋</span> Master Tables</a>
            <a href="vacancy-requests.html"><span class="icon">📝</span> Vacancy Requests</a>
            <a href="admin-job-openings.html"><span class="icon">📢</span> Job Openings</a>
            <a href="hr-screening-results.html" class="active"><span class="icon">🔍</span> Screening Results</a>
            <a href="admin-change-password.html"><span class="icon">🔑</span> Change Password</a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="avatar" id="avatar-initials">A</div>
                <div class="user-info">
                    <p id="user-name">Admin</p>
                    <span id="user-role">HR</span>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <p class="page-title">🔍 Screening Results</p>

        <div class="alert alert-success" id="success-alert"></div>
        <div class="alert alert-error"   id="error-alert"></div>

        <!-- Job Selector -->
        <div class="job-select-card">
            <div class="form-group">
                <label>Select Job Opening</label>
                <select id="job-select" onchange="loadResults()">
                    <option value="">— Select a job —</option>
                </select>
            </div>
            <div class="count-badge" id="count-badge">
                ⭐ <span id="shortlist-count">0</span> Shortlisted
            </div>
        </div>

        <!-- Results Area -->
        <div id="results-area">
            <div class="empty-state">
                <div class="icon">🔍</div>
                <p>Select a job opening to view shortlisted candidates</p>
            </div>
        </div>

    </main>
</div>

<script>
const API   = 'http://127.0.0.1:8000/api';
const token = localStorage.getItem('access_token');
const role  = localStorage.getItem('role_code');
if (!token) window.location.href = 'index.html';
if (role !== 'ADMIN' && role !== 'HR') window.location.href = 'employee-dashboard.html';

const uname = localStorage.getItem('employee_name') || 'Admin';
document.getElementById('user-name').textContent       = uname;
document.getElementById('user-role').textContent       = localStorage.getItem('role_name') || 'HR';
document.getElementById('avatar-initials').textContent = uname.charAt(0).toUpperCase();

function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
}
function logout() { localStorage.clear(); window.location.href = 'index.html'; }

function showAlert(type, msg) {
    const el = document.getElementById(`${type}-alert`);
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3500);
}

function scoreColor(score) {
    if (score >= 80) return '#10B981';
    if (score >= 60) return '#F59E0B';
    if (score >= 40) return '#F97316';
    return '#EF4444';
}
function rankEmoji(i) { return ['🥇','🥈','🥉'][i] || `#${i+1}`; }

let allResults = [];
let currentTab = 'all';

// ── Load Jobs ────────────────────────────────────────────────────────────────
async function loadJobs() {
    try {
        const res  = await fetch(`${API}/recruitment/results/`, { headers: authHeaders() });
        const jobs = await res.json();
        const sel  = document.getElementById('job-select');
        (Array.isArray(jobs) ? jobs : []).forEach(j => {
            const opt = document.createElement('option');
            opt.value       = j.id;
            opt.textContent = `${j.title}${j.department ? ' — ' + j.department : ''} (${j.result_count} screened)`;
            sel.appendChild(opt);
        });
    } catch(e) { console.error('Jobs load failed', e); }
}

// ── Load Results ─────────────────────────────────────────────────────────────
async function loadResults() {
    const jobId = document.getElementById('job-select').value;
    if (!jobId) return;

    document.getElementById('results-area').innerHTML = `
        <div class="empty-state">
            <div style="width:40px;height:40px;border:4px solid #E5E7EB;border-top-color:#4F46E5;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px"></div>
            <p>Loading results...</p>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;

    try {
        const res  = await fetch(`${API}/recruitment/results/${jobId}/`, { headers: authHeaders() });
        const data = await res.json();
        allResults = (Array.isArray(data) ? data : (data.results || []));
        allResults.sort((a, b) => b.match_score - a.match_score);

        const shortlisted = allResults.filter(r => r.is_shortlisted);
        document.getElementById('shortlist-count').textContent = shortlisted.length;
        document.getElementById('count-badge').style.display   = 'block';

        currentTab = 'shortlisted'; // ← default to shortlisted view for HR
        renderUI();

    } catch(e) {
        document.getElementById('results-area').innerHTML =
            '<div class="empty-state"><div class="icon">❌</div><p>Failed to load results.</p></div>';
    }
}

// ── Render UI ─────────────────────────────────────────────────────────────────
function renderUI() {
    const shortlisted = allResults.filter(r => r.is_shortlisted);
    const area = document.getElementById('results-area');

    area.innerHTML = `
        <!-- Summary -->
        <div class="summary-bar">
            <span class="summary-pill pill-total">📊 ${allResults.length} total screened</span>
            <span class="summary-pill pill-shortlisted">⭐ ${shortlisted.length} shortlisted</span>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab ${currentTab==='shortlisted'?'active':''}" onclick="switchTab('shortlisted')">⭐ Shortlisted (${shortlisted.length})</button>
            <button class="tab ${currentTab==='all'?'active':''}"         onclick="switchTab('all')">All Candidates (${allResults.length})</button>
        </div>

        <!-- Cards -->
        <div class="cards-grid" id="cards-grid"></div>
    `;

    renderCards(currentTab === 'shortlisted' ? shortlisted : allResults);
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderCards(tab === 'shortlisted'
        ? allResults.filter(r => r.is_shortlisted)
        : allResults);
}

// ── Render Cards ──────────────────────────────────────────────────────────────
function renderCards(results) {
    const grid = document.getElementById('cards-grid');
    if (!grid) return;

    if (!results.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
            <div class="icon">${currentTab === 'shortlisted' ? '⭐' : '📭'}</div>
            <p>${currentTab === 'shortlisted' ? 'No candidates shortlisted yet for this job.' : 'No screening results found.'}</p>
        </div>`;
        return;
    }

    grid.innerHTML = results.map((r, i) => {
        const color  = scoreColor(r.match_score);
        const skills = (r.skills || '').split(',').map(s => s.trim()).filter(Boolean);
        const srId   = r.id || r.screening_result_id;

        return `
        <div class="candidate-card ${r.is_shortlisted ? 'shortlisted' : ''}" id="card-${srId}">
            <span class="card-rank">${rankEmoji(i)}</span>

            <div>
                <div class="card-name">${r.candidate_name}</div>
                <div class="card-email">${r.candidate_email || 'No email'}</div>
            </div>

            <!-- Score Ring -->
            <div class="score-row">
                <div class="score-ring" style="color:${color};border-color:${color}">
                    ${r.match_score}%
                </div>
                <div class="score-bar-wrap">
                    <div class="score-bar-label">Match Score</div>
                    <div class="score-bar-bg">
                        <div class="score-bar-fill" style="width:${r.match_score}%;background:${color}"></div>
                    </div>
                </div>
            </div>

            <!-- Reason -->
            <div class="reason-text">${r.reason || '—'}</div>

            <!-- Skills -->
            ${skills.length ? `
            <div class="skills-wrap">
                ${skills.slice(0, 5).map(s => `<span class="skill-tag">${s}</span>`).join('')}
                ${skills.length > 5 ? `<span class="skill-tag" style="background:#F3F4F6;color:#9CA3AF">+${skills.length-5} more</span>` : ''}
            </div>` : ''}

            <!-- Badges -->
            <div class="badges-row">
                ${r.is_shortlisted ? '<span class="badge badge-shortlisted">⭐ Shortlisted</span>' : ''}
                ${r.best_section   ? `<span class="badge badge-section">📌 ${r.best_section}</span>` : ''}
            </div>

            <!-- Action -->
            <div class="card-actions">
                ${r.is_shortlisted
                    ? `<button class="btn-action btn-remove" onclick="removeShortlist(${srId})">❌ Remove from Shortlist</button>`
                    : `<button class="btn-action btn-add"    onclick="addShortlist(${srId})">✅ Add to Shortlist</button>`
                }
            </div>
        </div>`;
    }).join('');
}

// ── Shortlist Actions ─────────────────────────────────────────────────────────
async function addShortlist(srId) {
    try {
        const res = await fetch(`${API}/recruitment/shortlist/${srId}/`, {
            method: 'POST', headers: authHeaders(), body: JSON.stringify({})
        });
        if (res.ok) {
            showAlert('success', '✅ Candidate shortlisted');
            const r = allResults.find(r => (r.id || r.screening_result_id) === srId);
            if (r) r.is_shortlisted = true;
            renderUI();
        } else {
            const d = await res.json();
            showAlert('error', d.error || 'Failed to shortlist');
        }
    } catch(e) { showAlert('error', 'Something went wrong'); }
}

async function removeShortlist(srId) {
    if (!confirm('Remove this candidate from shortlist?')) return;
    try {
        const res = await fetch(`${API}/recruitment/shortlist/${srId}/`, {
            method: 'DELETE', headers: authHeaders()
        });
        if (res.ok || res.status === 204) {
            showAlert('success', 'Removed from shortlist');
            const r = allResults.find(r => (r.id || r.screening_result_id) === srId);
            if (r) r.is_shortlisted = false;
            renderUI();
        } else {
            showAlert('error', 'Failed to remove');
        }
    } catch(e) { showAlert('error', 'Something went wrong'); }
}

// Init
loadJobs();
</script>
</body>
</html>
