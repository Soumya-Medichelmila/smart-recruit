<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart_Recruit — Screening Results</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .job-select-card { background:white;border-radius:16px;padding:20px 24px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:24px; }
        .results-table { width:100%;border-collapse:collapse; }
        .results-table th { background:#F9FAFB;padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:#6B7280;text-transform:uppercase;border-bottom:1px solid #E5E7EB; }
        .results-table td { padding:14px 16px;border-bottom:1px solid #F3F4F6;font-size:13px;color:#374151;vertical-align:middle; }
        .results-table tr:hover td { background:#FAFAFA; }
        .score-bar-wrap { display:flex;align-items:center;gap:10px; }
        .score-bar-bg { flex:1;background:#F3F4F6;border-radius:20px;height:8px;overflow:hidden;min-width:80px; }
        .score-bar-fill { height:100%;border-radius:20px; }
        .score-num { font-size:13px;font-weight:800;min-width:36px; }
        .shortlist-btn { padding:6px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s; }
        .btn-shortlist { background:#D1FAE5;color:#065F46;border:1px solid #6EE7B7; }
        .btn-shortlist:hover { background:#A7F3D0; }
        .btn-remove { background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5; }
        .btn-remove:hover { background:#FECACA; }
        .shortlisted-badge { background:#D1FAE5;color:#065F46;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600; }
        .tabs { display:flex;gap:4px;background:#F3F4F6;padding:4px;border-radius:8px;margin-bottom:20px;max-width:350px; }
        .tab { flex:1;padding:8px;text-align:center;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:#6B7280;border:none;background:none; }
        .tab.active { background:white;color:#4F46E5;box-shadow:0 1px 3px rgba(0,0,0,.1); }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-logo"><h1>⚡ Smart_Recruit</h1><p>Admin Panel</p></div>
        <nav class="sidebar-nav">
            <a href="admin-dashboard.html"><span class="icon">🏠</span> Dashboard</a>
            <a href="employee-list.html"><span class="icon">👥</span> Employees</a>
            <a href="add-employee.html"><span class="icon">➕</span> Add Employee</a>
            <a href="masters.html"><span class="icon">📋</span> Master Tables</a>
            <a href="vacancy-requests.html"><span class="icon">📝</span> Vacancy Requests</a>
            <a href="admin-job-openings.html"><span class="icon">📢</span> Job Openings</a>
            <a href="hr-screening-results.html" class="active"><span class="icon">🔍</span> Screening Results</a>
            <a href="admin-change-password.html"><span class="icon">🔑</span> Change Password</a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="avatar" id="avatar-initials">A</div>
                <div class="user-info">
                    <p id="user-name">Admin</p>
                    <span id="user-role">HR</span>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <p class="page-title">🔍 Screening Results</p>

        <div class="alert alert-success" id="success-alert"></div>
        <div class="alert alert-error" id="error-alert"></div>

        <!-- Job Selector -->
        <div class="job-select-card">
            <div style="display:flex;gap:16px;align-items:flex-end">
                <div class="form-group" style="flex:1;margin-bottom:0">
                    <label>Select Job Opening</label>
                    <select id="job-select" onchange="loadResults()">
                        <option value="">-- Select a job --</option>
                    </select>
                </div>
                <div id="shortlist-count-badge" style="display:none;background:#EEF2FF;color:#4F46E5;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap">
                    ✅ <span id="shortlist-count">0</span> Shortlisted
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs" id="result-tabs" style="display:none">
            <button class="tab active" onclick="filterTab('all')">All Candidates</button>
            <button class="tab" onclick="filterTab('shortlisted')">✅ Shortlisted Only</button>
        </div>

        <!-- Results -->
        <div id="results-container">
            <div class="card" style="text-align:center;padding:48px">
                <div style="font-size:48px;margin-bottom:16px">🔍</div>
                <p style="color:#6B7280">Select a job opening above to view screening results</p>
            </div>
        </div>
    </main>
</div>

<script>
    const API = 'http://127.0.0.1:8000/api';
    const token = localStorage.getItem('access_token');
    const role = localStorage.getItem('role_code');
    if (!token) window.location.href = 'index.html';
    if (role !== 'ADMIN' && role !== 'HR') window.location.href = 'employee-dashboard.html';

    const name = localStorage.getItem('employee_name') || 'Admin';
    document.getElementById('user-name').textContent = name;
    document.getElementById('user-role').textContent = localStorage.getItem('role_name') || 'HR';
    document.getElementById('avatar-initials').textContent = name.charAt(0).toUpperCase();

    function authHeaders() { return { 'Content-Type':'application/json','Authorization':`Bearer ${token}` }; }
    function logout() { localStorage.clear(); window.location.href = 'index.html'; }

    function showSuccess(msg) {
        const el = document.getElementById('success-alert');
        el.textContent = msg; el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 3000);
    }
    function showError(msg) {
        const el = document.getElementById('error-alert');
        el.textContent = msg; el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 3000);
    }

    let allResults = [];
    let currentTab = 'all';

    function scoreColor(score) {
        if (score >= 80) return '#10B981';
        if (score >= 60) return '#F59E0B';
        if (score >= 40) return '#F97316';
        return '#EF4444';
    }

    function filterTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach((btn, i) => {
            btn.classList.toggle('active', ['all','shortlisted'][i] === tab);
        });
        renderResults(tab === 'shortlisted' ? allResults.filter(r => r.is_shortlisted) : allResults);
    }

    function renderResults(results) {
        const container = document.getElementById('results-container');
        const shortlistedCount = allResults.filter(r => r.is_shortlisted).length;
        document.getElementById('shortlist-count').textContent = shortlistedCount;

        if (!results.length) {
            container.innerHTML = `<div class="card" style="text-align:center;padding:48px"><p style="color:#6B7280">${currentTab === 'shortlisted' ? 'No candidates shortlisted yet' : 'No screening results found'}</p></div>`;
            return;
        }

        container.innerHTML = `
            <div class="card">
                <div class="table-wrapper">
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Candidate</th>
                                <th>Email</th>
                                <th>Match Score</th>
                                <th>Reason</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${results.map((r, i) => `
                            <tr id="row-${r.id}">
                                <td style="font-weight:800;color:#6B7280">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</td>
                                <td><strong>${r.candidate_name}</strong></td>
                                <td style="color:#6B7280;font-size:12px">${r.candidate_email || '—'}</td>
                                <td>
                                    <div class="score-bar-wrap">
                                        <div class="score-bar-bg">
                                            <div class="score-bar-fill" style="width:${r.match_score}%;background:${scoreColor(r.match_score)}"></div>
                                        </div>change-password.html
                                        <span class="score-num" style="color:${scoreColor(r.match_score)}">${r.match_score}%</span>
                                    </div>
                                </td>
                                <td style="color:#6B7280;font-size:12px;max-width:250px">${r.reason}</td>
                                <td>
                                    ${r.is_shortlisted
                                        ? '<span class="shortlisted-badge">✅ Shortlisted</span>'
                                        : '<span style="color:#9CA3AF;font-size:12px">Not shortlisted</span>'
                                    }
                                </td>
                                <td>
                                    ${r.is_shortlisted
                                        ? `<button class="shortlist-btn btn-remove" onclick="removeShortlist(${r.id})">❌ Remove</button>`
                                        : `<button class="shortlist-btn btn-shortlist" onclick="addShortlist(${r.id})">✅ Shortlist</button>`
                                    }
                                </td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }

    async function loadJobs() {
        try {
            // ✅ AllScreeningJobsView returns: [{id, title, department, result_count}, ...]
            const res = await fetch(`${API}/recruitment/results/`, { headers: authHeaders() });
            const jobs = await res.json();
            const select = document.getElementById('job-select');
            jobs.forEach(j => {
                const opt = document.createElement('option');
                opt.value = j.id;  // ✅ was j.job_id (undefined)
                opt.textContent = `${j.title} — ${j.department} (${j.result_count} candidates)`;
                select.appendChild(opt);
            });
        } catch(e) { console.error(e); }
    }

    async function loadResults() {
        const jobId = document.getElementById('job-select').value;
        if (!jobId) return;

        document.getElementById('results-container').innerHTML = '<div class="loading">Loading results...</div>';

        try {
            // ✅ ScreeningResultsView returns a plain array, not {results: [...]}
            const res = await fetch(`${API}/recruitment/results/${jobId}/`, { headers: authHeaders() });
            const data = await res.json();
            allResults = Array.isArray(data) ? data : (data.results || []);
            allResults.sort((a, b) => b.match_score - a.match_score);

            document.getElementById('result-tabs').style.display = 'flex';
            document.getElementById('shortlist-count-badge').style.display = 'block';

            currentTab = 'all';
            document.querySelectorAll('.tab').forEach((btn, i) => btn.classList.toggle('active', i === 0));
            renderResults(allResults);
        } catch(e) {
            document.getElementById('results-container').innerHTML = '<div class="loading">Failed to load results</div>';
        }
    }

    async function addShortlist(resultId) {
        try {
            const res = await fetch(`${API}/recruitment/shortlist/${resultId}/`, {
                method: 'POST', headers: authHeaders()
            });
            const data = await res.json();
            if (res.ok) {
                showSuccess('✅ Candidate shortlisted');
                loadResults();
            } else {
                showError(data.error || data.message || 'Failed to shortlist');
            }
        } catch(e) { showError('Something went wrong'); }
    }

    async function removeShortlist(resultId) {
        if (!confirm('Remove this candidate from shortlist?')) return;
        try {
            const res = await fetch(`${API}/recruitment/shortlist/${resultId}/`, {
                method: 'DELETE', headers: authHeaders()
            });
            if (res.ok) {
                showSuccess('Removed from shortlist');
                loadResults();
            } else {
                const data = await res.json();
                showError(data.error || 'Failed to remove');
            }
        } catch(e) { showError('Something went wrong'); }
    }

    loadJobs();
</script>
</body>
</html>
