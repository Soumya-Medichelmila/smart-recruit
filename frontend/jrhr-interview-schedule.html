<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synergy — Schedule Interviews</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-cols { display:grid; grid-template-columns:280px 1fr; gap:24px; align-items:start; }
        .jobs-panel { background:#fff; border-radius:16px; border:1px solid #E5E7EB; overflow:hidden; position:sticky; top:24px; }
        .jobs-panel-header { padding:14px 18px; background:#F9FAFB; border-bottom:1px solid #E5E7EB; font-size:13px; font-weight:700; color:#374151; }
        .job-item { padding:12px 16px; border-bottom:1px solid #F3F4F6; cursor:pointer; transition:all 0.15s; }
        .job-item:last-child { border-bottom:none; }
        .job-item:hover { background:#F5F7FF; }
        .job-item.active { background:#EEF2FF; border-left:3px solid #6366F1; }
        .job-item-title { font-size:13px; font-weight:700; color:#111827; margin-bottom:2px; }
        .job-item-meta { font-size:11px; color:#9CA3AF; }
        .job-item-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; background:#FEF3C7; color:#92400E; }
        .right-panel { min-width:0; }
        
        .cand-card { background:#fff; border-radius:14px; border:1px solid #E5E7EB; margin-bottom:14px; overflow:hidden; }
        .cand-card.scheduled { border-left:4px solid #10B981; }
        .cand-header { padding:14px 18px; border-bottom:1px solid #F3F4F6; display:flex; justify-content:space-between; align-items:center; }
        .cand-name { font-size:14px; font-weight:700; color:#111827; }
        .cand-email { font-size:12px; color:#6B7280; margin-top:2px; }
        .cand-body { padding:18px; }
        .ind-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .ind-grid .full { grid-column:1/-1; }
        .ind-group label { display:block; font-size:12px; font-weight:600; color:#374151; margin-bottom:5px; }
        .ind-group input, .ind-group select { width:100%; padding:9px 12px; border:1.5px solid #E5E7EB; border-radius:8px; font-size:13px; outline:none; background:#FAFAFA; box-sizing:border-box; }
        .ind-group input:focus, .ind-group select:focus { border-color:#6366F1; background:#fff; }
        .email-result { margin-top:10px; padding:10px 14px; border-radius:8px; font-size:13px; display:none; }
        .email-result.ok  { background:#D1FAE5; color:#065F46; display:block; }
        .email-result.err { background:#FEE2E2; color:#991B1B; display:block; }
        .score-pill { padding:4px 12px; border-radius:20px; font-size:11px; font-weight:700; color:#fff; }
        .scheduled-tag { background:#D1FAE5; color:#065F46; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:700; }
        .no-job { text-align:center; padding:80px 24px; background:#fff; border-radius:16px; border:1px dashed #E5E7EB; color:#9CA3AF; }

        /* ── Round Email Modal ──────────────────────────── */
        .modal-overlay {
            display:none; position:fixed; inset:0;
            background:rgba(0,0,0,0.45); z-index:1000;
            align-items:center; justify-content:center;
        }
        .modal-overlay.open { display:flex; }
        .modal-box {
            background:#fff; border-radius:18px; width:100%; max-width:480px;
            box-shadow:0 20px 60px rgba(0,0,0,0.2); overflow:hidden;
            animation: slideUp 0.2s ease;
        }
        @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .modal-header {
            padding:18px 22px; background:linear-gradient(135deg,#EA580C,#DC2626);
            color:#fff; display:flex; justify-content:space-between; align-items:center;
        }
        .modal-header-title { font-size:15px; font-weight:700; }
        .modal-header-sub { font-size:12px; opacity:0.85; margin-top:2px; }
        .modal-close { background:rgba(255,255,255,0.2); border:none; color:#fff; border-radius:50%; width:28px; height:28px; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .modal-close:hover { background:rgba(255,255,255,0.35); }
        .modal-body { padding:22px; }
        .modal-group { margin-bottom:14px; }
        .modal-group label { display:block; font-size:12px; font-weight:700; color:#374151; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.4px; }
        .modal-group input, .modal-group textarea {
            width:100%; padding:10px 13px; border:1.5px solid #E5E7EB;
            border-radius:9px; font-size:13px; outline:none; background:#FAFAFA;
            box-sizing:border-box; font-family:inherit; transition:border 0.15s;
        }
        .modal-group input:focus, .modal-group textarea:focus { border-color:#EA580C; background:#fff; }
        .modal-group textarea { resize:vertical; min-height:140px; }
        .modal-footer { padding:0 22px 20px; display:flex; gap:10px; }
        .modal-result { padding:0 22px 16px; font-size:13px; }
    </style>
</head>
<body>

<!-- ── Round Email Modal ──────────────────────────────────────────────────── -->
<div class="modal-overlay" id="round-modal" onclick="closeModalOnOverlay(event)">
    <div class="modal-box">
        <div class="modal-header">
            <div>
                <div class="modal-header-title">📨 Send Round Email</div>
                <div class="modal-header-sub" id="modal-candidate-name">—</div>
            </div>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="modal-group">
                <label>Round Name *</label>
                <input type="text" id="modal-round" placeholder="e.g. Technical Round 2, HR Round, Final Round..." />
            </div>
            <div class="modal-group">
                <label>Email Subject</label>
                <input type="text" id="modal-subj" />
            </div>
            <div class="modal-group">
                <label>Email Body</label>
                <textarea id="modal-body-tpl" rows="7"></textarea>
            </div>
        </div>
        <div class="modal-result"><div id="modal-result-msg"></div></div>
        <div class="modal-footer">
            <button class="btn btn-primary" id="modal-send-btn" onclick="submitRoundEmail()"
                style="background:#EA580C;border-color:#EA580C;flex:1">
                📨 Send Email
            </button>
            <button onclick="closeModal()" style="padding:10px 20px;border:1.5px solid #E5E7EB;border-radius:9px;font-size:13px;font-weight:600;background:#fff;cursor:pointer;color:#6B7280">
                Cancel
            </button>
        </div>
    </div>
</div>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-logo"><h1>⚡ Synergy</h1><p>Junior HR Portal</p></div>
        <nav class="sidebar-nav">
            <a href="jrhr-dashboard.html"><span class="icon">🏠</span> Dashboard</a>
            <a href="jrhr-interview-schedule.html" class="active"><span class="icon">📅</span> Schedule Interviews</a>
            <a href="change-password.html"><span class="icon">🔑</span> Change Password</a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="avatar" id="avatar-initials">J</div>
                <div class="user-info"><p id="user-name">Junior HR</p><span id="user-role">Junior HR</span></div>
            </div>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <p class="page-title">📅 Interview Scheduling</p>
        <div class="alert alert-success" id="success-alert"></div>
        <div class="alert alert-error"   id="error-alert"></div>

        <div class="page-cols">
            <div class="jobs-panel">
                <div class="jobs-panel-header">📋 Shortlisted Jobs</div>
                <div id="jobs-list"><div style="padding:20px;color:#9CA3AF;font-size:13px">Loading...</div></div>
            </div>
            <div class="right-panel" id="right-panel">
                <div class="no-job">
                    <div style="font-size:52px;margin-bottom:16px">📅</div>
                    <p style="font-size:16px;font-weight:700;color:#374151;margin-bottom:8px">Select a job</p>
                    <p style="font-size:13px">Pick a job from the left to schedule interviews</p>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
const API   = 'http://127.0.0.1:8000/api';
const token = localStorage.getItem('access_token');
const role  = localStorage.getItem('role_code');
if (!token) window.location.href = 'index.html';
if (role !== 'JR_HR') window.location.href = 'employee-dashboard.html';

const uname = localStorage.getItem('employee_name') || 'Junior HR';
document.getElementById('user-name').textContent = uname;
document.getElementById('user-role').textContent  = localStorage.getItem('role_name') || 'Junior HR';
document.getElementById('avatar-initials').textContent = uname.charAt(0).toUpperCase();

// ── Token expiry auto-logout ──────────────────────────────────────────────────
function isTokenExpired(t) {
    try { const p = JSON.parse(atob(t.split('.')[1])); return p.exp * 1000 < Date.now(); }
    catch { return true; }
}
function checkToken() {
    if (!localStorage.getItem('access_token') || isTokenExpired(localStorage.getItem('access_token'))) {
        localStorage.clear(); window.location.href = 'index.html';
    }
}
checkToken();
setInterval(checkToken, 30000);

function authHeaders() {
    return { 'Content-Type':'application/json', 'Authorization':`Bearer ${token}` };
}
async function apiFetch(url, opts = {}) {
    const res = await fetch(url, { ...opts, headers: authHeaders() });
    if (res.status === 401) { localStorage.clear(); window.location.href = 'index.html'; return null; }
    return res;
}
function logout() { localStorage.clear(); window.location.href = 'index.html'; }
function showSuccess(msg) {
    const el = document.getElementById('success-alert');
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 5000);
}
function showError(msg) {
    const el = document.getElementById('error-alert');
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 5000);
}

let allEmployees      = [];
let currentShortlists = [];
let selectedJobId     = null;
let selectedJobTitle  = '';
let modalShortlistId  = null;   // tracks which candidate the modal is for

const DEFAULT_SUBJECT = 'Interview Invitation — {job_title} at {company}';
const DEFAULT_BODY =
`Dear {candidate_name},

We are pleased to inform you that you have been shortlisted for the position of {job_title} at {company}.

INTERVIEW DETAILS:
━━━━━━━━━━━━━━━━━━━━━━━━
Date        : {date}
Time        : {time}
Mode        : {mode}
Location    : {link_or_venue}
━━━━━━━━━━━━━━━━━━━━━━━━

Please confirm your availability by replying to this email.

Best regards,
SynergyCom HR Team`;

const DEFAULT_RESEND_SUBJECT = '{round} Invitation — {job_title} at {company}';
const DEFAULT_RESEND_BODY =
`Dear {candidate_name},

We would like to invite you for the next stage of your interview for {job_title} at {company}.

INTERVIEW DETAILS:
━━━━━━━━━━━━━━━━━━━━━━━━
Round       : {round}
Date        : {date}
Time        : {time}
Mode        : {mode}
Location    : {link_or_venue}
━━━━━━━━━━━━━━━━━━━━━━━━

Please confirm your availability by replying to this email.

Best regards,
SynergyCom HR Team`;

function scoreColor(s) { return s>=80?'#10B981':s>=60?'#F59E0B':s>=40?'#F97316':'#EF4444'; }

// ── Modal ─────────────────────────────────────────────────────────────────────
function openRoundModal(shortlistId, candidateName) {
    modalShortlistId = shortlistId;
    document.getElementById('modal-candidate-name').textContent = '👤 ' + candidateName;
    document.getElementById('modal-round').value       = '';
    document.getElementById('modal-subj').value        = DEFAULT_RESEND_SUBJECT;
    document.getElementById('modal-body-tpl').value    = DEFAULT_RESEND_BODY;
    document.getElementById('modal-result-msg').innerHTML = '';
    document.getElementById('modal-send-btn').disabled = false;
    document.getElementById('modal-send-btn').textContent = '📨 Send Email';
    document.getElementById('round-modal').classList.add('open');
}
function closeModal() { document.getElementById('round-modal').classList.remove('open'); }
function closeModalOnOverlay(e) { if (e.target === document.getElementById('round-modal')) closeModal(); }

async function submitRoundEmail() {
    const roundName = document.getElementById('modal-round').value.trim();
    const subj      = document.getElementById('modal-subj').value;
    const body      = document.getElementById('modal-body-tpl').value;
    const resultEl  = document.getElementById('modal-result-msg');

    if (!roundName) {
        resultEl.innerHTML = '<div style="background:#FEF3C7;color:#92400E;padding:8px 12px;border-radius:8px;font-size:13px">⚠️ Please enter a round name</div>';
        return;
    }

    const btn = document.getElementById('modal-send-btn');
    btn.disabled = true; btn.textContent = '⏳ Sending...';
    resultEl.innerHTML = '';

    try {
        const res = await apiFetch(`${API}/recruitment/interview/resend-email/`, {
            method: 'POST',
            body: JSON.stringify({ shortlist_id: modalShortlistId, round_name: roundName, email_subject: subj, email_body: body })
        });
        if (!res) return;
        const data = await res.json();
        if (res.ok && data.sent) {
            resultEl.innerHTML = `<div style="background:#D1FAE5;color:#065F46;padding:8px 12px;border-radius:8px;font-size:13px">✅ "${data.round}" email sent to ${data.candidate}!</div>`;
            showSuccess(`"${data.round}" email sent successfully!`);
            btn.textContent = '✅ Sent';
            setTimeout(closeModal, 1800);
        } else {
            resultEl.innerHTML = `<div style="background:#FEE2E2;color:#991B1B;padding:8px 12px;border-radius:8px;font-size:13px">❌ ${data.message || 'Failed to send'}</div>`;
            btn.disabled = false; btn.textContent = '📨 Send Email';
        }
    } catch(e) {
        resultEl.innerHTML = '<div style="background:#FEE2E2;color:#991B1B;padding:8px 12px;border-radius:8px;font-size:13px">❌ Something went wrong</div>';
        btn.disabled = false; btn.textContent = '📨 Send Email';
    }
}

// ── Load ──────────────────────────────────────────────────────────────────────
async function loadJobs() {
    try {
        const res = await apiFetch(`${API}/recruitment/shortlist/all/`);
        if (!res || !res.ok) throw new Error();
        const jobs = await res.json();
        const el = document.getElementById('jobs-list');
        if (!jobs.length) {
            el.innerHTML = '<div style="padding:16px;color:#9CA3AF;font-size:13px">No shortlisted jobs yet.</div>';
            return;
        }
        el.innerHTML = jobs.map(j => `
            <div class="job-item" id="ji-${j.job_id}" onclick="selectJob(${j.job_id}, '${j.job_title.replace(/'/g,"\\'")}')">
                <div class="job-item-title">${j.job_title}</div>
                <div class="job-item-meta">🏢 ${j.department}</div>
                <div style="margin-top:6px"><span class="job-item-badge">⭐ ${j.shortlist_count} shortlisted</span></div>
            </div>`).join('');
    } catch {
        document.getElementById('jobs-list').innerHTML = '<div style="padding:16px;color:#EF4444;font-size:13px">Failed to load. Please refresh.</div>';
    }
}

async function loadEmployees() {
    try {
        const res = await apiFetch(`${API}/accounts/employees/`);
        if (!res) return;
        allEmployees = (await res.json()).filter(e => e.is_active_employee);
    } catch { allEmployees = []; }
}

async function selectJob(jobId, jobTitle) {
    selectedJobId = jobId; selectedJobTitle = jobTitle;
    document.querySelectorAll('.job-item').forEach(el => el.classList.remove('active'));
    document.getElementById(`ji-${jobId}`)?.classList.add('active');
    document.getElementById('right-panel').innerHTML = '<div style="text-align:center;padding:40px;color:#9CA3AF">Loading...</div>';
    try {
        const res = await apiFetch(`${API}/recruitment/shortlist/job/${jobId}/`);
        if (!res) return;
        currentShortlists = (await res.json()).shortlisted || [];
        renderRightPanel();
    } catch {
        document.getElementById('right-panel').innerHTML = '<div style="text-align:center;padding:40px;color:#EF4444">Failed to load candidates.</div>';
    }
}

function renderRightPanel() {
    const pending = currentShortlists.filter(s => !s.has_interview).length;
    const done    = currentShortlists.filter(s =>  s.has_interview).length;
    const empOpts = allEmployees.map(e => `<option value="${e.id}">${e.first_name} ${e.last_name} — ${e.designation||'Employee'}</option>`).join('');
    const ivOpts  = `<option value="">— Select Interviewer —</option>${empOpts}`;

    document.getElementById('right-panel').innerHTML = `
        <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">
            <div style="background:#fff;border-radius:10px;padding:12px 18px;border:1px solid #E5E7EB;font-size:13px">
                <span style="font-weight:800;font-size:18px;color:#6366F1">${currentShortlists.length}</span> Total
            </div>
            <div style="background:#FEF3C7;border-radius:10px;padding:12px 18px;border:1px solid #FDE68A;font-size:13px">
                <span style="font-weight:800;font-size:18px;color:#92400E">${pending}</span> Pending
            </div>
            <div style="background:#D1FAE5;border-radius:10px;padding:12px 18px;border:1px solid #6EE7B7;font-size:13px">
                <span style="font-weight:800;font-size:18px;color:#065F46">${done}</span> Scheduled
            </div>
        </div>
        
        <div id="tab-content">
            ${renderIndividualTab(empOpts)}
        </div>`;
}

// ── Individual Tab ────────────────────────────────────────────────────────────
function renderIndividualTab(empOpts) {
    if (!currentShortlists.length) return '<div style="text-align:center;padding:64px;color:#9CA3AF">No candidates</div>';
    return currentShortlists.map(s => `
    <div class="cand-card ${s.has_interview?'scheduled':''}" id="cc-${s.id}">
        <div class="cand-header">
            <div>
                <div class="cand-name">👤 ${s.candidate_name}</div>
                <div class="cand-email">✉️ ${s.candidate_email
                    ? `<span style="color:#059669">${s.candidate_email}</span> <span style="font-size:10px;color:#9CA3AF">(auto-extracted)</span>`
                    : '<span style="color:#EF4444">No email found in resume</span>'}</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
                <span class="score-pill" style="background:${scoreColor(s.match_score)}">${s.match_score}%</span>
                ${s.has_interview
                    ? `<span class="scheduled-tag">✅ Scheduled</span>
                       <button onclick="openRoundModal(${s.id}, '${s.candidate_name.replace(/'/g,"\\'")}')
                       " style="padding:5px 14px;background:#EA580C;color:#fff;border:none;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer">
                           📨 Send Round Email
                       </button>`
                    : ''}
            </div>
        </div>
        <div class="cand-body">
            ${s.has_interview
                /* ── Already scheduled: clean info only ── */
                ? `<div style="background:#F0FDF4;border:1.5px solid #6EE7B7;border-radius:10px;padding:12px 16px;font-size:13px;color:#065F46">
                       ✅ Interview scheduled. Use <strong>Send Round Email</strong> above to invite for next rounds.
                   </div>`

                /* ── Not scheduled: schedule form ── */
                : `<details style="margin-bottom:14px">
                       <summary style="font-size:12px;font-weight:700;color:#6366F1;cursor:pointer">✉️ Customize Email</summary>
                       <div style="margin-top:10px">
                           <div class="ind-group" style="margin-bottom:10px">
                               <label>Subject</label>
                               <input type="text" id="subj-${s.id}" value="${DEFAULT_SUBJECT}" />
                           </div>
                           <div class="ind-group">
                               <label>Body</label>
                               <textarea id="body-${s.id}" rows="6" style="width:100%;padding:9px 12px;border:1.5px solid #E5E7EB;border-radius:8px;font-size:12px;outline:none;background:#FAFAFA;box-sizing:border-box;resize:vertical;font-family:inherit">${DEFAULT_BODY}</textarea>
                           </div>
                       </div>
                   </details>
                   <div class="ind-grid">
                       <div class="ind-group"><label>Date *</label><input type="date" id="d-${s.id}" min="${new Date().toISOString().split('T')[0]}" /></div>
                       <div class="ind-group"><label>Time *</label><input type="time" id="t-${s.id}" /></div>
                       <div class="ind-group"><label>Mode *</label>
                           <select id="m-${s.id}" onchange="toggleIndMode(${s.id})">
                               <option value="ONLINE">🌐 Online</option>
                               <option value="OFFLINE">🏢 Offline</option>
                           </select>
                       </div>
                       <div class="ind-group"><label>Interviewer *</label>
                           <select id="iv-${s.id}"><option value="">— Select —</option>${empOpts}</select>
                       </div>
                       <div class="ind-group full" id="lnk-${s.id}"><label>Meeting Link</label><input type="url" id="lv-${s.id}" placeholder="https://meet.google.com/..." /></div>
                       <div class="ind-group full" id="ven-${s.id}" style="display:none"><label>Venue</label><input type="text" id="lv-ven-${s.id}" placeholder="Conference Room..." /></div>
                       <div class="ind-group full"><label>Notes</label><input type="text" id="n-${s.id}" placeholder="e.g. Technical round" /></div>
                   </div>
                   <div style="margin-top:12px">
                       <button class="btn btn-primary" id="ibtn-${s.id}" onclick="scheduleOne(${s.id})" style="font-size:13px">📅 Schedule & Send Email</button>
                   </div>
                   <div class="email-result" id="er-${s.id}"></div>`
            }
        </div>
    </div>`).join('');
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function toggleIndMode(sid) {
    const m = document.getElementById(`m-${sid}`)?.value;
    document.getElementById(`lnk-${sid}`).style.display = m==='ONLINE'?'block':'none';
    document.getElementById(`ven-${sid}`).style.display = m==='OFFLINE'?'block':'none';
}

async function scheduleOne(sid) {
    const date  = document.getElementById(`d-${sid}`)?.value;
    const time  = document.getElementById(`t-${sid}`)?.value;
    const mode  = document.getElementById(`m-${sid}`)?.value;
    const iv    = document.getElementById(`iv-${sid}`)?.value;
    const lv    = mode==='ONLINE'?(document.getElementById(`lv-${sid}`)?.value||''):(document.getElementById(`lv-ven-${sid}`)?.value||'');
    const notes = document.getElementById(`n-${sid}`)?.value||'';
    const subj  = document.getElementById(`subj-${sid}`)?.value||DEFAULT_SUBJECT;
    const body  = document.getElementById(`body-${sid}`)?.value||DEFAULT_BODY;
    if (!date||!time||!iv) { showError('Fill date, time and interviewer'); return; }
    const btn = document.getElementById(`ibtn-${sid}`);
    btn.disabled = true; btn.textContent = '⏳ Scheduling...';
    try {
        const res = await apiFetch(`${API}/recruitment/interview/schedule/${sid}/`, {
            method:'POST',
            body: JSON.stringify({ interview_date:date, interview_time:time, mode, meeting_link:mode==='ONLINE'?lv:'', venue:mode==='OFFLINE'?lv:'', assigned_interviewer:parseInt(iv), notes, email_subject:subj, email_body:body })
        });
        if (!res) return;
        const data = await res.json();
        const er = document.getElementById(`er-${sid}`);
        if (res.ok) {
            er.className = 'email-result ok';
            er.innerHTML = `✅ Scheduled! ${data.emails_sent?.candidate?'📧 Email sent':'⚠️ Email not sent (no email in resume)'}`;
            setTimeout(() => selectJob(selectedJobId, selectedJobTitle), 1200);
        } else {
            er.className = 'email-result err';
            er.textContent = '❌ '+(data.message||JSON.stringify(data));
            btn.disabled = false; btn.textContent = '📅 Schedule & Send Email';
        }
    } catch { showError('Something went wrong'); btn.disabled=false; btn.textContent='📅 Schedule & Send Email'; }
}

async function init() { await loadEmployees(); await loadJobs(); }
init();
</script>
