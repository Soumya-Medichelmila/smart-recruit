<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnergyCom — Screen Resumes</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ── COMPACT LAYOUT VARIABLES ─────────────────────────────────────────────── */
        :root {
            --gap: 16px; /* Reduced from 24px */
            --pad: 12px; /* Reduced padding */
            --font-sm: 12px;
        }

        body { font-size: 13px; } /* Smaller base font */

        .screen-layout { display:grid;grid-template-columns:280px 1fr;gap:var(--gap);align-items:start; }
        
        .panel { background:#fff;border-radius:8px;border:1px solid #E5E7EB;box-shadow:0 1px 2px rgba(0,0,0,0.05);overflow:hidden; }
        .panel-header { padding:10px 14px;border-bottom:1px solid #E5E7EB;background:#F9FAFB; }
        .panel-title { font-size:12px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:0.5px; }
        .panel-body { padding:var(--pad);max-height:650px;overflow-y:auto; }

        /* ── DENSE LIST ITEMS ─────────────────────────────────────────────────────── */
        .list-item { display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:6px;margin-bottom:4px;cursor:pointer;border:1px solid transparent;transition:all 0.1s; }
        .list-item:hover { background:#F3F4F6; }
        .list-item.selected { background:#EEF2FF;border-color:#6366F1; }
        .item-main { display:flex;align-items:center;gap:8px; }
        .checkbox { width:14px;height:14px;accent-color:#6366F1;cursor:pointer; }
        .item-text { display:flex;flex-direction:column; }
        .item-title { font-size:12px;font-weight:600;color:#111827;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px; }
        .item-sub { font-size:10px;color:#6B7280; }

        /* ── ACTION CARD (Compact) ───────────────────────────────────────────────── */
        .action-card { background:linear-gradient(135deg,#4F46E5,#7C3AED);border-radius:8px;padding:16px;color:#fff;margin-bottom:var(--gap);display:flex;align-items:center;justify-content:space-between; }
        .action-info { flex:1; }
        .action-title { font-size:14px;font-weight:700;margin-bottom:2px; }
        .action-desc { font-size:11px;opacity:0.9; }
        .btn-screen { background:#fff;color:#4F46E5;font-weight:600;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:12px; }
        .btn-screen:active { transform:scale(0.98); }

        /* ── DENSE RESULTS TABLE ───────────────────────────────────────────────────── */
        .results-container { background:#fff;border-radius:8px;border:1px solid #E5E7EB;overflow:hidden; }
        .results-header { padding:10px 14px;border-bottom:1px solid #E5E7EB;display:flex;justify-content:space-between;align-items:center;background:#F9FAFB; }
        .results-table { width:100%;border-collapse:collapse; table-layout: fixed; }
        .results-table th { text-align:left;padding:8px 12px;font-size:10px;font-weight:700;color:#6B7280;text-transform:uppercase;background:#F9FAFB;border-bottom:1px solid #E5E7EB; }
        .results-table td { padding:10px 12px;border-bottom:1px solid #F3F4F6;color:#374151;font-size:12px;vertical-align:middle; }
        .results-table tr:last-child td { border-bottom:none; }
        .results-table tr:hover td { background:#F9FAFB; }

        /* Column Widths for Compact View */
        .col-rank { width: 50px; text-align:center; }
        .col-candidate { width: 160px; }
        .col-file { width: 200px; } /* Slightly wider for filenames */
        .col-score { width: 140px; }
        .col-reason { width: auto; }

        /* Table Elements */
        .rank-badge { display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;font-size:10px;font-weight:700;color:#fff; }
        .rank-1 { background:#FBBF24; } .rank-2 { background:#9CA3AF; } .rank-3 { background:#B45309; } .rank-other { background:#E5E7EB;color:#6B7280; }
        
        .file-badge { display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 6px;background:#F3F4F6;border-radius:3px;font-family:'Courier New',monospace;font-size:10px;color:#4B5563; }

        .score-bar-container { display:flex;align-items:center;gap:6px; }
        .score-track { flex:1;height:4px;background:#E5E7EB;border-radius:2px;overflow:hidden; }
        .score-fill { height:100%;border-radius:2px;transition:width 0.4s ease; }
        .score-val { font-weight:700;font-size:11px;width:30px;text-align:right; }

        .reason-text { line-height:1.4;color:#4B5563;font-size:11px;max-height:40px;overflow:hidden;position:relative; }
        .reason-text::after {
            content:''; position:absolute; bottom:0; left:0; width:100%; height:15px;
            background:linear-gradient(transparent, #fff); pointer-events:none;
        }

        /* Utilities */
        .select-bar { display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11px;color:#6B7280; }
        .link-btn { background:none;border:none;color:#6366F1;font-size:11px;font-weight:600;cursor:pointer; }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-logo"><h1>⚡ EnergyCom</h1><p>Hiring Portal</p></div>
        <nav class="sidebar-nav">
            <a href="employee-dashboard.html"><span class="icon">🏠</span> Dashboard</a>
            <div class="sidebar-divider">Recruitment</div>
            <a href="recruitment-resumes.html"><span class="icon">📄</span> Resume Pool</a>
            <a href="recruitment-screen.html" class="active"><span class="icon">🔍</span> Screen Resumes</a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="avatar" id="avatar-initials">R</div>
                <div class="user-info"><p id="user-name">Recruiter</p><span id="user-role">HR</span></div>
            </div>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h2 style="margin:0;font-size:18px;color:#111827">Screen Resumes</h2>
            <div id="top-alert" style="display:none;padding:6px 12px;background:#D1FAE5;color:#065F46;border-radius:4px;font-size:11px;"></div>
        </div>

        <div class="screen-layout">
            <!-- LEFT: Inputs (Compact) -->
            <div>
                <div class="panel" style="margin-bottom:12px;">
                    <div class="panel-header"><span class="panel-title">Job</span></div>
                    <div class="panel-body" id="job-list">
                        <div style="text-align:center;padding:10px;color:#9CA3AF;font-size:11px">Loading...</div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">Files</span>
                        <span id="selected-count" style="font-size:10px;background:#EEF2FF;color:#4338CA;padding:1px 6px;border-radius:8px">0</span>
                    </div>
                    <div class="panel-body">
                        <div class="select-bar">
                            <span id="total-resumes">0 files</span>
                            <button class="link-btn" onclick="toggleSelectAll()">All</button>
                        </div>
                        <div id="resume-list">
                            <div style="text-align:center;padding:10px;color:#9CA3AF;font-size:11px">Loading...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: Results (Dense Table) -->
            <div>
                <div class="action-card">
                    <div class="action-info">
                        <div class="action-title">AI Screening</div>
                        <div class="action-desc">Select files & Job to analyze</div>
                    </div>
                    <button class="btn-screen" onclick="runScreening()" id="screen-btn">Run</button>
                </div>

                <div class="results-container">
                    <div class="results-header">
                        <span style="font-weight:700;color:#111827">Results</span>
                        <span id="result-count" style="font-size:11px;color:#6B7280">0 candidates</span>
                    </div>
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th class="col-rank">#</th>
                                <th class="col-candidate">Candidate</th>
                                <th class="col-file">Source File</th>
                                <th class="col-score">Score</th>
                                <th class="col-reason">Analysis</th>
                            </tr>
                        </thead>
                        <tbody id="results-body">
                            <tr><td colspan="5" style="text-align:center;color:#9CA3AF;padding:30px;">No data</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    const API = 'http://127.0.0.1:8000/api';
    const token = localStorage.getItem('access_token');
    if (!token) window.location.href = 'index.html';

    const name = localStorage.getItem('employee_name') || 'User';
    document.getElementById('user-name').textContent = name;
    document.getElementById('avatar-initials').textContent = name.charAt(0).toUpperCase();

    function authHeaders() { return { 'Content-Type':'application/json','Authorization':`Bearer ${token}` }; }
    function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    function showAlert(msg) { const el=document.getElementById('top-alert'); el.textContent=msg; el.style.display='block'; setTimeout(()=>el.style.display='none', 3000); }

    let selectedJobId = null;
    let allResumes = [];
    let allSelected = false;

    async function loadJobs() {
        try {
            const res = await fetch(`${API}/jobs/openings/`, { headers: authHeaders() });
            const jobs = await res.json();
            const openJobs = jobs.filter(j => j.status === 'OPEN');
            const el = document.getElementById('job-list');
            if (!openJobs.length) { el.innerHTML = '<div style="text-align:center;color:#EF4444;font-size:11px">No Jobs</div>'; return; }
            el.innerHTML = openJobs.map(j => `
                <div class="list-item" id="job-${j.id}" onclick="selectJob(${j.id})">
                    <div class="item-main">
                        <div class="item-title">${j.title}</div>
                        <div class="item-sub">${j.department_name}</div>
                    </div>
                </div>`).join('');
        } catch(e) { console.error(e); }
    }

    function selectJob(id) {
        selectedJobId = id;
        document.querySelectorAll('.list-item').forEach(e => e.classList.remove('selected'));
        const el = document.getElementById(`job-${id}`);
        if(el) el.classList.add('selected');
    }

    async function loadResumes() {
        try {
            const res = await fetch(`${API}/recruitment/folder-resumes/`, { headers: authHeaders() });
            const data = await res.json();
            allResumes = data.resumes || [];
            document.getElementById('total-resumes').textContent = `${allResumes.length} files`;
            const el = document.getElementById('resume-list');
            if (!allResumes.length) { el.innerHTML = '<div style="text-align:center;color:#9CA3AF;font-size:11px">Empty</div>'; return; }
            el.innerHTML = allResumes.map((r, i) => `
                <div class="list-item" id="ri-${i}" onclick="toggleResume(${i})">
                    <div class="item-main">
                        <input type="checkbox" id="cb-${i}" value="${r.filename}" class="checkbox" onclick="event.stopPropagation()">
                        <div class="item-text">
                            <div class="item-title">${r.filename}</div>
                            <div class="item-sub">${r.ext}</div>
                        </div>
                    </div>
                </div>`).join('');
        } catch(e) { console.error(e); }
    }

    function toggleResume(i) {
        const cb = document.getElementById(`cb-${i}`);
        const row = document.getElementById(`ri-${i}`);
        cb.checked = !cb.checked;
        row.classList.toggle('selected', cb.checked);
        updateCount();
    }

    function toggleSelectAll() {
        allSelected = !allSelected;
        document.querySelectorAll('#resume-list input').forEach(cb => {
            cb.checked = allSelected;
            document.getElementById(`ri-${cb.id.split('-')[1]}`).classList.toggle('selected', allSelected);
        });
        updateCount();
    }

    function updateCount() {
        const c = document.querySelectorAll('#resume-list input:checked').length;
        document.getElementById('selected-count').textContent = c;
    }

    async function runScreening() {
        if (!selectedJobId) { alert('Select Job'); return; }
        const f = Array.from(document.querySelectorAll('#resume-list input:checked')).map(cb => cb.value);
        if (!f.length) { alert('Select Files'); return; }

        const btn = document.getElementById('screen-btn'); btn.textContent='...'; btn.disabled=true;
        try {
            const res = await fetch(`${API}/recruitment/folder-screen/${selectedJobId}/`, {
                method: 'POST', headers: authHeaders(), body: JSON.stringify({ filenames: f })
            });
            const d = await res.json();
            if (res.ok) { showAlert(`Done: ${d.total}`); renderResults(d.results); }
            else alert(d.error);
        } catch(e) { alert('Error'); }
        btn.textContent='Run'; btn.disabled=false;
    }

    function renderResults(r) {
        const tb = document.getElementById('results-body');
        document.getElementById('result-count').textContent = `${r.length} candidates`;
        if(!r.length) { tb.innerHTML='<tr><td colspan="5" style="text-align:center;padding:20px;color:#9CA3AF">No results</td></tr>'; return; }
        const s = r.sort((a,b) => b.match_score - a.match_score);
        tb.innerHTML = s.map((x,i) => {
            let c='#EF4444'; if(x.match_score>=80)c='#10B981'; else if(x.match_score>=60)c='#F59E0B';
            let b='rank-other'; if(i===0)b='rank-1'; else if(i===1)b='rank-2'; else if(i===2)b='rank-3';
            return `<tr>
                <td class="col-rank"><span class="rank-badge ${b}">${i+1}</span></td>
                <td class="col-candidate">
                    <div style="font-weight:600;font-size:12px;color:#111827">${x.candidate_name}</div>
                    ${x.candidate_email?`<div style="font-size:10px;color:#9CA3AF">${x.candidate_email}</div>`:''}
                </td>
                <td class="col-file"><div class="file-badge">${x.source_filename}</div></td>
                <td class="col-score">
                    <div class="score-bar-container">
                        <div class="score-track"><div class="score-fill" style="width:${x.match_score}%;background:${c}"></div></div>
                        <div class="score-val" style="color:${c}">${x.match_score}%</div>
                    </div>
                </td>
                <td class="col-reason"><div class="reason-text">${x.reason}</div></td>
            </tr>`;
        }).join('');
    }

    loadJobs(); loadResumes();
</script>
</body>
</html>
